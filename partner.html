<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>Evolution Optical • Voucher Stage Partner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/backend-config.js"></script><script src="assets/js/stage-auth.js"></script><script src="assets/js/stage-operations.js"></script><style>body{margin:0;padding:20px;background:#050716;color:#fff;font-family:system-ui,-apple-system,sans-serif}.shell{max-width:820px;margin:auto}.card{padding:20px;border:1px solid #454b88;border-radius:18px;background:#0b1738;margin-bottom:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#3a2b00;color:#ffd666;font-weight:800;font-size:12px}input,select,button,a{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:12px;border:1px solid #5f6fd0;background:#182b73;color:#fff;text-decoration:none}input,select{background:#091633}.ok{color:#65e6b5}.bad{color:#ff92a5}.hidden{display:none}.item{padding:12px;border:1px solid #33457e;border-radius:12px;background:#091633;margin-top:10px}.small{font-size:12px;color:#aab8d8}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.row{grid-template-columns:1fr}}</style></head><body><main class="shell"><section class="card"><span class="tag">VOUCHER STAGE</span><h1>Partner Portal</h1><p>Project: <code id="project"></code></p><div id="login"><input id="email" type="email" placeholder="Partner email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Sign In</button></div><div id="status"></div><div id="signed" class="hidden"><button id="logoutBtn">Sign Out</button></div></section><section id="ops" class="card hidden"><h2>Issue Voucher</h2><div id="catalog"></div><select id="version"><option value="">Select Voucher</option></select><div class="row"><input id="customer" placeholder="Customer name"><input id="phone" placeholder="Customer phone (optional)"></div><button id="issueBtn">Issue Stage Voucher</button><div id="issueStatus"></div><div id="issued"></div></section><section class="card"><a href="index.html">Back to Stage Home</a></section></main><script>(()=>{const c=window.EVOLUTION_VOUCHER_BACKEND||{},auth=window.VOUCHER_STAGE_AUTH,ops=window.VOUCHER_STAGE_OPS,project=document.getElementById('project'),status=document.getElementById('status'),login=document.getElementById('login'),signed=document.getElementById('signed'),opCard=document.getElementById('ops');project.textContent=c.projectId||'unavailable';let currentCatalog=[];const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const show=(node,t,ok=false)=>node.innerHTML=t?`<p class="${ok?'ok':'bad'}">${esc(t)}</p>`:'';async function loadCatalog(){currentCatalog=await ops.partner.catalog()||[];document.getElementById('catalog').innerHTML=currentCatalog.length?currentCatalog.map(r=>`<div class="item"><b>${esc(r.template_code||r.template_name||'Voucher')}</b><div class="small">${esc(r.version_name||r.version_no||'')}</div><div class="small">Remaining: ${esc(r.remaining_allocation??r.allocation_remaining??'—')}</div></div>`).join(''):'<div class="small">No Voucher available.</div>';document.getElementById('version').innerHTML='<option value="">Select Voucher</option>'+currentCatalog.map(r=>`<option value="${esc(r.version_id)}">${esc(r.template_code||r.template_name||r.version_id)}</option>`).join('');}async function refresh(){try{const i=await auth.identify('partner');if(!i.authenticated){login.classList.remove('hidden');signed.classList.add('hidden');opCard.classList.add('hidden');show(status,'');return;}const r=i.realm||{};if(r.authenticated!==true||!String(r.realm||'').toLowerCase().includes('partner')){await auth.signOut('partner');throw new Error('This account is not an active Partner account.');}await ops.partner.context();login.classList.add('hidden');signed.classList.remove('hidden');opCard.classList.remove('hidden');show(status,`Partner identity verified: ${i.session.user.email||i.session.user.id}`,true);await loadCatalog();}catch(e){login.classList.remove('hidden');signed.classList.add('hidden');opCard.classList.add('hidden');show(status,e?.message||'Partner verification failed.');}}document.getElementById('loginBtn').onclick=async()=>{try{show(status,'Signing in…',true);await auth.signIn('partner',document.getElementById('email').value,document.getElementById('password').value);await refresh();}catch(e){show(status,e?.message||'Sign in failed.');}};document.getElementById('logoutBtn').onclick=async()=>{try{await auth.signOut('partner');await refresh();}catch(e){show(status,e?.message||'Sign out failed.');}};document.getElementById('issueBtn').onclick=async()=>{const versionId=document.getElementById('version').value,customerName=document.getElementById('customer').value.trim(),customerPhone=document.getElementById('phone').value.trim();const out=document.getElementById('issueStatus'),issued=document.getElementById('issued');show(out,'');issued.innerHTML='';if(!versionId)return show(out,'Select a Voucher first.');if(!customerName)return show(out,'Customer name is required.');if(!currentCatalog.some(r=>String(r.version_id)===versionId))return show(out,'Selected Voucher is not in the current Stage catalog.');document.getElementById('issueBtn').disabled=true;try{const data=await ops.partner.issue({versionId,customerName,customerPhone});show(out,`Voucher ${data?.voucher_code||''} issued in Stage.`,true);let share='';if(data?.voucher_id){try{const s=await ops.partner.share(data.voucher_id);share=s?.message_body||'';}catch(_){}}const url=data?.public_token?`${c.siteBase}voucher.html?v=${encodeURIComponent(data.public_token)}`:'';issued.innerHTML=`<div class="item"><b>${esc(data?.voucher_type||'Voucher')}</b><div>Code: ${esc(data?.voucher_code||'—')}</div><div>Expiry: ${esc(data?.expiry_date||'—')}</div>${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Open customer voucher</a>`:''}${share?`<div class="small">${esc(share)}</div>`:''}</div>`;document.getElementById('customer').value='';document.getElementById('phone').value='';await loadCatalog();}catch(e){show(out,e?.message||'Voucher issuance failed.');}finally{document.getElementById('issueBtn').disabled=false;}};refresh();})();</script></body></html>
