<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>Evolution Optical • Voucher Stage Partner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/backend-config.js"></script><script src="assets/js/stage-auth.js"></script><style>body{margin:0;padding:20px;background:#050716;color:#fff;font-family:system-ui,-apple-system,sans-serif}.shell{max-width:760px;margin:auto}.card{padding:20px;border:1px solid #454b88;border-radius:18px;background:#0b1738;margin-bottom:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#3a2b00;color:#ffd666;font-weight:800;font-size:12px}input,button,a{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:12px;border:1px solid #5f6fd0;background:#182b73;color:#fff;text-decoration:none;font-weight:800}input{background:#091633;font-weight:500}.ok{color:#65e6b5}.bad{color:#ff92a5}.hidden{display:none}</style></head><body><main class="shell"><section class="card"><span class="tag">VOUCHER STAGE</span><h1>Partner Portal</h1><p>Project: <code id="project"></code></p><div id="login"><input id="email" type="email" placeholder="Partner email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Sign In</button></div><div id="status"></div><div id="signed" class="hidden"><button id="logoutBtn">Sign Out</button></div></section><section class="card"><a href="index.html">Back to Stage Home</a></section></main><script>(()=>{const c=window.EVOLUTION_VOUCHER_BACKEND||{},auth=window.VOUCHER_STAGE_AUTH,project=document.getElementById('project'),status=document.getElementById('status'),login=document.getElementById('login'),signed=document.getElementById('signed');project.textContent=c.projectId||'unavailable';const show=(t,ok=false)=>status.innerHTML=t?`<p class="${ok?'ok':'bad'}">${String(t).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}</p>`:'';async function refresh(){try{const i=await auth.identify('partner');if(!i.authenticated){login.classList.remove('hidden');signed.classList.add('hidden');show('');return;}const r=i.realm||{};if(r.authenticated!==true||!String(r.realm||'').toLowerCase().includes('partner')){await auth.signOut('partner');throw new Error('This account is not an active Partner account.');}login.classList.add('hidden');signed.classList.remove('hidden');show(`Partner identity verified: ${i.session.user.email||i.session.user.id}`,true);}catch(e){login.classList.remove('hidden');signed.classList.add('hidden');show(e?.message||'Partner verification failed.');}}document.getElementById('loginBtn').onclick=async()=>{try{show('Signing in…',true);await auth.signIn('partner',document.getElementById('email').value,document.getElementById('password').value);await refresh();}catch(e){show(e?.message||'Sign in failed.');}};document.getElementById('logoutBtn').onclick=async()=>{try{await auth.signOut('partner');await refresh();}catch(e){show(e?.message||'Sign out failed.');}};refresh();})();</script></body></html>
