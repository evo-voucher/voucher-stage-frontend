<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>Evolution Optical • Voucher Stage Staff</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/backend-config.js"></script><script src="assets/js/stage-auth.js"></script><script src="assets/js/stage-operations.js"></script><style>body{margin:0;padding:20px;background:#050716;color:#fff;font-family:system-ui,-apple-system,sans-serif}.shell{max-width:820px;margin:auto}.card{padding:20px;border:1px solid #454b88;border-radius:18px;background:#0b1738;margin-bottom:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#3a2b00;color:#ffd666;font-weight:800;font-size:12px}input,select,textarea,button,a{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:12px;border:1px solid #5f6fd0;background:#182b73;color:#fff;text-decoration:none}input,select,textarea{background:#091633}.ok{color:#65e6b5}.bad{color:#ff92a5}.hidden{display:none}.item{padding:12px;border:1px solid #33457e;border-radius:12px;background:#091633;margin-top:10px}.small{font-size:12px;color:#aab8d8}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.row{grid-template-columns:1fr}}</style></head><body><main class="shell"><section class="card"><span class="tag">VOUCHER STAGE</span><h1>Staff Portal</h1><p>Project: <code id="project"></code></p><div id="login"><input id="email" type="email" placeholder="Staff email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Sign In</button></div><div id="status"></div><div id="signed" class="hidden"><button id="logoutBtn">Sign Out</button></div></section><section id="ops" class="card hidden"><h2>Verify & Redeem</h2><div id="staffMeta" class="small"></div><div id="branchWrap" class="hidden"><select id="branch"><option value="">Select branch</option></select></div><input id="voucherCode" placeholder="Voucher code"><button id="verifyBtn">Verify Voucher</button><div id="verifyStatus"></div><div id="verified"></div><div id="redeemBox" class="hidden"><textarea id="notes" placeholder="Notes (optional)"></textarea><button id="redeemBtn">Confirm Stage Redemption</button><div id="redeemStatus"></div></div></section><section class="card"><a href="index.html">Back to Stage Home</a></section></main><script>(()=>{const c=window.EVOLUTION_VOUCHER_BACKEND||{},auth=window.VOUCHER_STAGE_AUTH,ops=window.VOUCHER_STAGE_OPS,project=document.getElementById('project'),status=document.getElementById('status'),login=document.getElementById('login'),signed=document.getElementById('signed'),opCard=document.getElementById('ops');project.textContent=c.projectId||'unavailable';let context=null,verified=null;const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const show=(node,t,ok=false)=>node.innerHTML=t?`<p class="${ok?'ok':'bad'}">${esc(t)}</p>`:'';function branchCode(){if(!context)return null;return context.branch_selection_required?document.getElementById('branch').value:(context.branches?.[0]?.branch_code||null);}async function loadContext(){context=await ops.staff.operationalContext();document.getElementById('staffMeta').textContent=`${context?.staff_name||'Staff'} • ${context?.role||''}`;const branches=Array.isArray(context?.branches)?context.branches:[];const wrap=document.getElementById('branchWrap'),sel=document.getElementById('branch');if(context?.branch_selection_required){wrap.classList.remove('hidden');sel.innerHTML='<option value="">Select branch</option>'+branches.map(b=>`<option value="${esc(b.branch_code)}">${esc(b.branch_name)} (${esc(b.branch_code)})</option>`).join('');}else{wrap.classList.add('hidden');}}async function refresh(){try{const i=await auth.identify('staff');if(!i.authenticated){login.classList.remove('hidden');signed.classList.add('hidden');opCard.classList.add('hidden');show(status,'');return;}const r=i.realm||{},realm=String(r.realm||'').toLowerCase();if(r.authenticated!==true||!(realm.includes('staff')||realm.includes('manager'))){await auth.signOut('staff');throw new Error('This account is not an active Staff or Manager account.');}await ops.staff.context();login.classList.add('hidden');signed.classList.remove('hidden');opCard.classList.remove('hidden');show(status,`Staff identity verified: ${i.session.user.email||i.session.user.id}`,true);await loadContext();}catch(e){login.classList.remove('hidden');signed.classList.add('hidden');opCard.classList.add('hidden');show(status,e?.message||'Staff verification failed.');}}document.getElementById('loginBtn').onclick=async()=>{try{show(status,'Signing in…',true);await auth.signIn('staff',document.getElementById('email').value,document.getElementById('password').value);await refresh();}catch(e){show(status,e?.message||'Sign in failed.');}};document.getElementById('logoutBtn').onclick=async()=>{try{await auth.signOut('staff');await refresh();}catch(e){show(status,e?.message||'Sign out failed.');}};document.getElementById('verifyBtn').onclick=async()=>{const code=document.getElementById('voucherCode').value.trim(),branch=branchCode(),out=document.getElementById('verifyStatus'),box=document.getElementById('redeemBox');verified=null;box.classList.add('hidden');document.getElementById('verified').innerHTML='';show(out,'');if(!code)return show(out,'Enter a Voucher code.');if(context?.branch_selection_required&&!branch)return show(out,'Select a branch first.');document.getElementById('verifyBtn').disabled=true;try{const v=await ops.staff.verify({voucherCode:code,branchCode:branch});if(!v?.success)throw new Error(v?.error||'Voucher verification failed.');verified=v;document.getElementById('verified').innerHTML=`<div class="item"><b>${esc(v.voucher_type||v.voucher_code||'Voucher')}</b><div>Code: ${esc(v.voucher_code||code)}</div><div>Customer: ${esc(v.customer_name||'—')}</div><div>Status: ${esc(v.voucher_status||v.status||'—')}</div><div class="small">${v.can_redeem?'Ready to redeem':'Not redeemable'}</div></div>`;show(out,'Voucher verified.',true);box.classList.toggle('hidden',!v.can_redeem);}catch(e){show(out,e?.message||'Voucher verification failed.');}finally{document.getElementById('verifyBtn').disabled=false;}};document.getElementById('redeemBtn').onclick=async()=>{const out=document.getElementById('redeemStatus');show(out,'');if(!verified?.can_redeem)return show(out,'Verify a redeemable Voucher first.');document.getElementById('redeemBtn').disabled=true;try{const r=await ops.staff.redeem({voucherCode:verified.voucher_code,branchCode:branchCode(),notes:document.getElementById('notes').value.trim()||null,method:'manual_code'});if(!r?.success)throw new Error(r?.error||'Redemption failed.');show(out,`Redeemed successfully${r.branch_name?` at ${r.branch_name}`:''}.`,true);document.getElementById('voucherCode').value='';document.getElementById('notes').value='';document.getElementById('verified').innerHTML='';document.getElementById('redeemBox').classList.add('hidden');verified=null;await loadContext();}catch(e){show(out,e?.message||'Redemption failed.');}finally{document.getElementById('redeemBtn').disabled=false;}};refresh();})();</script></body></html>
