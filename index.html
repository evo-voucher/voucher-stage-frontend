<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evolution Voucher Stage</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b0b;color:#fff;margin:0;padding:24px}main{max-width:820px;margin:auto}.card{background:#171717;border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:16px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#3a2b00;color:#ffd666;font-size:13px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #444;background:#111;color:#fff}button{cursor:pointer;background:#292929}button:hover{background:#353535}.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#a8a8a8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-list{display:grid;gap:10px;margin-top:12px}.result-card{background:#101010;border:1px solid #2d2d2d;border-radius:12px;padding:14px}.result-card h3{margin:0 0 8px;font-size:17px}.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px}.kv div:nth-child(odd){color:#9ca3af}.empty{padding:16px;border:1px dashed #444;border-radius:12px;color:#b7b7b7}.status-line{margin-top:12px;font-weight:600}@media(max-width:640px){.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){margin-top:6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}}
  </style>
</head>
<body>
<main>
  <div class="card">
    <span class="tag">VOUCHER STAGE</span>
    <h1>Evolution Voucher Stage Test Console</h1>
    <p>Target project: <code>tagusbcluzoxueixjmwh</code></p>
    <p>This console is isolated from Production.</p>
    <button id="healthBtn">Check Stage Connection</button>
    <div id="health"></div>
  </div>

  <div class="card">
    <h2>Stage Login</h2>
    <input id="email" type="email" placeholder="Stage account email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="grid"><button id="loginBtn">Sign In</button><button id="logoutBtn">Sign Out</button></div>
    <div id="authStatus"></div>
  </div>

  <div class="card">
    <h2>Read-only checks</h2>
    <p class="muted">Results are shown in readable cards instead of raw JSON.</p>
    <div class="grid">
      <button data-table="partners">Read partners</button>
      <button data-table="vouchers">Read vouchers</button>
      <button data-table="redemptions">Read redemptions</button>
      <button data-table="branches">Read branches</button>
    </div>
    <div id="resultStatus" class="status-line">No query run yet.</div>
    <div id="result" class="result-list"></div>
  </div>
</main>
<script>
const cfg={url:'https://tagusbcluzoxueixjmwh.supabase.co',key:'sb_publishable_R86zjGv4yso-krORZdj3IQ_7QZUtMMB'};
const client=window.supabase.createClient(cfg.url,cfg.key,{auth:{storageKey:'evolution-voucher-stage-auth'}});
const health=document.getElementById('health');
const authStatus=document.getElementById('authStatus');
const result=document.getElementById('result');
const resultStatus=document.getElementById('resultStatus');

const labelMap={
  id:'ID',branch_code:'Branch Code',branch_name:'Branch Name',address:'Address',phone:'Phone',status:'Status',
  partner_code:'Partner Code',partner_name:'Partner Name',contact_person:'Contact Person',contact_phone:'Contact Phone',
  voucher_code:'Voucher Code',customer_name:'Customer',customer_phone:'Customer Phone',voucher_type:'Voucher Type',expiry_date:'Expiry Date',
  redeemed_at:'Redeemed At',redeem_method:'Redeem Method',staff_name_snapshot:'Staff',notes:'Notes'
};
const preferredFields={
  branches:['branch_code','branch_name','address','phone','status'],
  partners:['partner_code','partner_name','contact_person','contact_phone','status'],
  vouchers:['voucher_code','customer_name','customer_phone','voucher_type','status','expiry_date'],
  redemptions:['redeemed_at','redeem_method','status','staff_name_snapshot','notes']
};
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function renderRows(table,rows){
  result.innerHTML='';
  if(!Array.isArray(rows)||rows.length===0){result.innerHTML='<div class="empty">No data found in Stage.</div>';return;}
  const fields=preferredFields[table]||Object.keys(rows[0]||{}).slice(0,6);
  rows.forEach((row,i)=>{
    const title=row.branch_name||row.partner_name||row.voucher_code||`Record ${i+1}`;
    const items=fields.filter(k=>row[k]!==undefined&&row[k]!==null&&row[k]!=='' ).map(k=>`<div>${esc(labelMap[k]||k)}</div><div>${esc(row[k])}</div>`).join('');
    result.insertAdjacentHTML('beforeend',`<div class="result-card"><h3>${esc(title)}</h3><div class="kv">${items}</div></div>`);
  });
}

async function showSession(){const {data}=await client.auth.getSession();const s=data?.session;authStatus.innerHTML=s?`<p class="ok">Signed in: ${s.user.email||s.user.id}</p>`:'<p>Not signed in.</p>';}

document.getElementById('healthBtn').onclick=async()=>{health.textContent='Checking...';const {error}=await client.from('partners').select('id',{head:false,count:'exact'}).limit(1);if(error){health.innerHTML=`<p class="bad">Stage reached, but query returned: ${esc(error.message)}</p>`;}else{health.innerHTML='<p class="ok">Stage connection OK. Project target is Voucher Stage.</p>';}};

document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {error}=await client.auth.signInWithPassword({email,password});if(error)authStatus.innerHTML=`<p class="bad">${esc(error.message)}</p>`;else await showSession();};
document.getElementById('logoutBtn').onclick=async()=>{await client.auth.signOut();await showSession();};

document.querySelectorAll('[data-table]').forEach(btn=>btn.onclick=async()=>{
  const table=btn.dataset.table;
  resultStatus.textContent=`Reading ${table}...`;
  result.innerHTML='';
  const {data,error}=await client.from(table).select('*').limit(5);
  if(error){resultStatus.textContent=`ERROR reading ${table}: ${error.message}`;result.innerHTML='';return;}
  resultStatus.textContent=`SUCCESS: ${table} returned ${Array.isArray(data)?data.length:0} row${Array.isArray(data)&&data.length===1?'':'s'} (showing up to 5).`;
  renderRows(table,data);
});

showSession();
</script>
</body>
</html>
