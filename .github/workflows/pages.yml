name: Deploy Voucher Stage Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Stage-only references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=.git 'xfivcfwexcxsyiylgryn' .; then
            echo 'Production Supabase project ref found.' >&2
            exit 1
          fi
          grep -q "projectId: 'tagusbcluzoxueixjmwh'" assets/js/backend-config.js
          grep -q "environment: 'stage'" assets/js/backend-config.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
